<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convertisseur Chinois : Simplifié ➔ Traditionnel</title>
    <script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.js"></script>
    <style>
        :root {
            --primary-color: #d32f2f;
            --bg-color: #f5f5f5;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 800px;
        }

        h1 {
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 600px) {
            .grid-layout {
                grid-template-columns: 1fr 1fr;
            }
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        textarea {
            width: 100%;
            height: 250px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            resize: vertical;
            font-size: 16px;
            box-sizing: border-box;
        }

        .controls {
            text-align: center;
            margin-top: 20px;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:hover {
            background-color: #b71c1c;
        }

        .copy-btn {
            background-color: #555;
            margin-top: 10px;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🇨🇳 Convertisseur Chinois</h1>
    
    <div class="grid-layout">
        <div>
            <label for="input">Chinois Simplifié (Mainland)</label>
            <textarea id="input" placeholder="Collez votre texte ici..."></textarea>
        </div>
        
        <div>
            <label for="output">Chinois Traditionnel</label>
            <textarea id="output" readonly placeholder="Le résultat apparaîtra ici..."></textarea>
            <button class="copy-btn" onclick="copyText()">Copier le résultat</button>
        </div>
    </div>

    <div class="controls">
        <button onclick="convertText()">Convertir en Traditionnel ➔</button>
    </div>
</div>

<script>
    // Initialisation du convertisseur (Simplifié vers Traditionnel Taïwan)
    // 's2t' = Simplified to Traditional
    // 's2twp' = Simplified to Traditional (Taiwan standard with phrases)
    const converter = OpenCC.Converter({ from: 'cn', to: 'tw' });

    function convertText() {
        const input = document.getElementById('input').value;
        const outputField = document.getElementById('output');
        
        if (!input.trim()) {
            alert("Veuillez entrer du texte.");
            return;
        }

        // Exécution de la conversion
        const result = converter(input);
        outputField.value = result;
    }

    function copyText() {
        const output = document.getElementById('output');
        output.select();
        document.execCommand('copy');
        alert("Texte copié !");
    }
</script>

</body>
</html>
