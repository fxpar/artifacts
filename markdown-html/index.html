<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convertisseur Markdown <-> HTML</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
    <script src="https://unpkg.com/turndown/dist/turndown.js"></script>

    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --text: #1e293b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        h1 { text-align: center; color: var(--primary); }

        .editor-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .pane {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        label { font-weight: bold; display: flex; justify-content: space-between; align-items: center; }

        textarea {
            width: 100%;
            height: 400px;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-family: "Fira Code", monospace;
            font-size: 14px;
            resize: vertical;
            box-sizing: border-box;
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        button {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            background-color: var(--primary);
            color: white;
            cursor: pointer;
            font-weight: 500;
            transition: opacity 0.2s;
        }

        button:hover { opacity: 0.9; }
        
        button.secondary { background-color: #64748b; }

        input[type="file"] { display: none; }
        
        .file-label {
            padding: 8px 16px;
            background-color: #10b981;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Markdown ⟷ HTML</h1>

    <div class="editor-container">
        <div class="pane">
            <label>
                Markdown
                <div class="controls">
                    <label class="file-label" for="upload-md">Charger .md</label>
                    <input type="file" id="upload-md" accept=".md,.txt">
                    <button onclick="copyToClipboard('markdown-input')">Copier</button>
                    <button class="secondary" onclick="downloadFile('markdown-input', 'document.md')">Enregistrer</button>
                </div>
            </label>
            <textarea id="markdown-input" placeholder="Collez votre Markdown ici..."></textarea>
        </div>

        <div class="pane">
            <label>
                HTML
                <div class="controls">
                    <button onclick="copyToClipboard('html-output')">Copier</button>
                    <button class="secondary" onclick="downloadFile('html-output', 'document.html')">Enregistrer</button>
                </div>
            </label>
            <textarea id="html-output" placeholder="Le résultat HTML apparaîtra ici..."></textarea>
        </div>
    </div>
</div>

<script>
    const mdInput = document.getElementById('markdown-input');
    const htmlOutput = document.getElementById('html-output');
    const turndownService = new TurndownService({ headingStyle: 'atx' });

    // --- Logique de Conversion ---

    // Markdown vers HTML
    mdInput.addEventListener('input', () => {
        const rawValue = mdInput.value;
        htmlOutput.value = marked.parse(rawValue);
    });

    // HTML vers Markdown
    htmlOutput.addEventListener('input', () => {
        const rawValue = htmlOutput.value;
        mdInput.value = turndownService.turndown(rawValue);
    });

    // --- Fonctions Utilitaires ---

    // Charger un fichier
    document.getElementById('upload-md').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            mdInput.value = e.target.result;
            // Déclencher manuellement la conversion
            htmlOutput.value = marked.parse(mdInput.value);
        };
        reader.readAsText(file);
    });

    // Copier dans le presse-papier
    async function copyToClipboard(id) {
        const text = document.getElementById(id).value;
        try {
            await navigator.clipboard.writeText(text);
            alert("Copié !");
        } catch (err) {
            alert("Erreur lors de la copie.");
        }
    }

    // Télécharger le fichier
    function downloadFile(id, filename) {
        const text = document.getElementById(id).value;
        const blob = new Blob([text], { type: 'text/plain' });
        const elem = window.document.createElement('a');
        elem.href = window.URL.createObjectURL(blob);
        elem.download = filename;
        document.body.appendChild(elem);
        elem.click();
        document.body.removeChild(elem);
    }
</script>

</body>
</html>
