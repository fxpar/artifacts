<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convertisseur de Tableaux - Ultra Fast</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.4.19/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .custom-shadow { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="min-h-screen bg-base-200 p-4 md:p-8">

    <div class="max-w-5xl mx-auto space-y-6">
        <header class="text-center space-y-2">
            <h1 class="text-4xl font-bold text-primary">TableConvert Pro</h1>
            <p class="text-base-content/70">Collez votre tableau Excel ou Word pour une conversion instantanée.</p>
        </header>

        <div class="card bg-base-100 custom-shadow">
            <div class="card-body">
                
                <div class="form-control mb-6">
                    <label class="label">
                        <span class="label-text font-semibold">1. Collez vos données ici</span>
                    </label>
                    <textarea 
                        id="inputArea" 
                        placeholder="Copiez vos cellules dans Excel et collez-les ici..." 
                        class="textarea textarea-bordered h-48 font-mono text-sm focus:textarea-primary"
                    ></textarea>
                </div>

                <div class="flex flex-wrap gap-4 items-end mb-6">
                    <div class="form-control">
                        <label class="label">
                            <span class="label-text">Format de sortie</span>
                        </label>
                        <select id="formatSelect" class="select select-bordered w-full max-w-xs">
                            <option value="csv_comma">CSV (Virgule)</option>
                            <option value="csv_semicolon">CSV (Point-virgule)</option>
                            <option value="csv_tab">TSV (Tabulation)</option>
                            <option value="markdown">Markdown Table</option>
                            <option value="json">JSON Array</option>
                        </select>
                    </div>

                    <button id="convertBtn" class="btn btn-primary px-8">Convertir</button>
                    <button id="clearBtn" class="btn btn-ghost">Effacer</button>
                </div>

                <div class="form-control">
                    <div class="flex justify-between items-center mb-2">
                        <label class="label">
                            <span class="label-text font-semibold">2. Résultat</span>
                        </label>
                        <button id="copyBtn" class="btn btn-sm btn-outline btn-secondary">Copier le résultat</button>
                    </div>
                    <textarea 
                        id="outputArea" 
                        readonly 
                        class="textarea textarea-bordered h-64 font-mono text-sm bg-base-200"
                    ></textarea>
                </div>

            </div>
        </div>

        <footer class="text-center text-xs text-base-content/50">
            Traitement local uniquement • Aucune donnée n'est envoyée vers un serveur.
        </footer>
    </div>

    <div id="toast" class="toast toast-end hidden">
        <div class="alert alert-success">
            <span>Copié dans le presse-papier !</span>
        </div>
    </div>

    <script>
        const inputArea = document.getElementById('inputArea');
        const outputArea = document.getElementById('outputArea');
        const formatSelect = document.getElementById('formatSelect');
        const convertBtn = document.getElementById('convertBtn');
        const copyBtn = document.getElementById('copyBtn');
        const clearBtn = document.getElementById('clearBtn');
        const toast = document.getElementById('toast');

        // Fonction principale de conversion
        function processData() {
            const rawData = inputArea.value.trim();
            if (!rawData) {
                outputArea.value = "";
                return;
            }

            // Parser le contenu Excel (Tab-Separated Values)
            const rows = rawData.split(/\r?\n/).map(row => row.split('\t'));
            const format = formatSelect.value;
            let result = "";

            switch (format) {
                case 'csv_comma':
                    result = rows.map(r => r.map(c => `"${c.replace(/"/g, '""')}"`).join(',')).join('\n');
                    break;
                case 'csv_semicolon':
                    result = rows.map(r => r.map(c => `"${c.replace(/"/g, '""')}"`).join(';')).join('\n');
                    break;
                case 'csv_tab':
                    result = rows.map(r => r.join('\t')).join('\n');
                    break;
                case 'markdown':
                    if (rows.length > 0) {
                        const header = `| ${rows[0].join(' | ')} |`;
                        const separator = `| ${rows[0].map(() => '---').join(' | ')} |`;
                        const body = rows.slice(1).map(r => `| ${r.join(' | ')} |`).join('\n');
                        result = `${header}\n${separator}\n${body}`;
                    }
                    break;
                case 'json':
                    const headers = rows[0];
                    const jsonData = rows.slice(1).map(row => {
                        let obj = {};
                        row.forEach((cell, i) => {
                            obj[headers[i] || `column${i+1}`] = cell;
                        });
                        return obj;
                    });
                    result = JSON.stringify(jsonData, null, 4);
                    break;
            }

            outputArea.value = result;
        }

        // Événements
        convertBtn.addEventListener('click', processData);
        
        clearBtn.addEventListener('click', () => {
            inputArea.value = "";
            outputArea.value = "";
            inputArea.focus();
        });

        copyBtn.addEventListener('click', () => {
            if (!outputArea.value) return;
            outputArea.select();
            document.execCommand('copy');
            
            // Notification simple
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 2000);
        });

        // Conversion auto lors du changement de format
        formatSelect.addEventListener('change', () => {
            if (inputArea.value) processData();
        });
    </script>
</body>
</html>
